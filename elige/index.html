<!DOCTYPE html>
<!--

  Muestra las listas que el dueño ha marcado como «elegibles por el público» y, al tocar una, ese display la pone.
  El QR lleva solo el canal del público (derivado del canal de la instalación, no al revés) y el código del display:
  desde aquí no se pueden mandar avisos, ni apagar, ni ninguna otra orden. No se guarda ni se pide ningún dato.
  Licencia GPL-3.0 · mediaservi.com
-->
<html lang="es">

    button i { flex: none; width: 13px; height: 13px; border-radius: 50%; background: #1d1407; box-shadow: inset 0 1px 2px #000; }
    button.on { color: #fff; background: linear-gradient(180deg, #3a3a3f, #232326); box-shadow: inset 0 2px 5px rgba(0, 0, 0, .65); }

    button[disabled] { opacity: .55; cursor: default; }
    .nota { color: #9aa0aa; font-size: 14px; }
    footer { padding: 9px 12px; text-align: center; color: #8d929c; font-size: 13px; background: #19191b; border-top: 1px solid #0a0a0b; }
    footer a { color: inherit; }
  </style>
</head>
