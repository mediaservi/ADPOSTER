<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FOTO · ADPOSTER</title>
  <meta name="description" content="Editor de imagen de ADPOSTER: capas, ajustes, filtros y botones mágicos, en tu navegador.">
  <meta name="theme-color" content="#1c1c1f">
  <link rel="icon" href="../assets/logos/adposter-icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../escena.css?v=1.19">
  <link rel="stylesheet" href="../gestor.css?v=1.19">
  <link rel="stylesheet" href="foto.css?v=1.19">
</head>
<body class="foto">
  <header class="cab">
    <a class="marca" href="../" aria-label="ADPOSTER"><img src="../assets/logos/adposter-logo-lema.svg" alt="ADPOSTER" width="454" height="120"></a>
    <div class="centro"><span class="fo-tit">FOTO</span></div>
    <div class="der"><button type="button" class="tecla ic-bt" id="fo-idioma"><span class="ic ic-lang" aria-hidden="true"></span><small class="cod">ES</small></button></div>
  </header>
  <main class="fo-consola">
    <nav class="fo-herr" id="fo-herr" aria-label="Herramientas"></nav>
    <section class="zona fo-centro" aria-label="Imagen">
      <div class="barra fo-barra" id="fo-barra"></div>
      <div class="fo-lienzo" id="fo-lienzo"><canvas id="fo-vista"></canvas><div class="fo-capa" id="fo-capa"></div><div class="fo-vacio" id="fo-vacio"></div></div>
      <div class="estado" id="fo-estado"><i></i><span></span></div>
    </section>
    <section class="zona lado fo-lado" aria-label="Paneles"><div class="tabs" id="fo-tabs" role="tablist"></div><div class="cuerpo" id="fo-cuerpo" role="tabpanel"></div></section>
  </main>
  <footer class="pie" id="pie"><div class="pie-l"></div><div class="pie-c" id="pie-c"></div><div class="pie-r"></div></footer>
  <input type="file" id="fo-abre" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp,.psd,image/vnd.adobe.photoshop" hidden>
  <input type="file" id="fo-capa-img" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp,.psd,image/vnd.adobe.photoshop" hidden>
  <noscript><p style="padding:2rem;color:#fff">FOTO necesita JavaScript activado.</p></noscript>
  <script src="../credito.js?v=1.20"></script>
  <script src="../fallo.js?v=1.19"></script>
  <script src="px.js?v=1.19"></script>
  <script src="foto.js?v=1.19"></script>
  <script src="herr.js?v=1.19"></script>
  <script src="ia.js?v=1.19"></script>
</body>
</html>
