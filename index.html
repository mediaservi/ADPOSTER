<!DOCTYPE html>
<!--
  ADPOSTER · CARTELERÍA DIGITAL — gestor de listas y displays. Apartado de AVHUB (mediaservi.com).
  Versión v1.6. Cuatro ventanas: a la izquierda, fijas, DISPLAYS (cómo está cada pantalla, en directo) y LISTAS; en el centro el LIENZO,
  con la vista previa en vivo, zoom y guías que se arrastran; a la derecha, las pestañas CONTENIDO · DISEÑO · TIEMPOS · DIRECTO · PUBLICAR.
  Los reproductores son las URL que se dan al kiosco: …/cine, …/klub y …/p/?l=nombre. La página del público es …/elige (se llega por QR).
  Una lista puede ser de carteles (carpetas que rotan) o una composición de escenas que se editan en el lienzo, pieza a pieza.
  Módulos: gestor.js (este gestor), editor.js (composición en el lienzo y galería de plantillas), gestion.js (biblioteca y calendario), escena.js (pinta las escenas, también en el reproductor), plantillas.js, player.js (reproductor), directo.js (canal en tiempo real), qr.js (códigos QR, de terceros, MIT),
  playlists.json (ajustes) y assets/manifest.json (índice de imágenes y vídeos, lo genera tools/preparar.py).
  Licencia GPL-3.0 · mediaservi.com
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ADPOSTER · Cartelería digital</title>
  <meta name="description" content="ADPOSTER: cartelería digital sencilla pero potente para autónomos y negocios pequeños. Listas de carteles con anuncios intercalados, en vertical u horizontal, con horarios, avisos al momento, cinta de texto, códigos QR y control de todas las pantallas desde el móvil.">
  <meta name="theme-color" content="#232325">
  <link rel="icon" href="assets/logos/adposter-icono.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/logos/adposter-180.png">
  <link rel="stylesheet" href="escena.css?v=1.6">
  <link rel="stylesheet" href="gestor.css?v=1.6">
</head>
<body>
  <header class="cab">
    <a class="marca" href="./" aria-label="ADPOSTER"><img src="assets/logos/adposter-logo-lema.svg" alt="ADPOSTER" width="454" height="120"></a>
    <a class="centro" href="https://avhub.mediaservi.com/" target="_blank" rel="noopener" aria-label="AVHUB"><img src="assets/logos/avhub-logo.svg" alt="AVHUB"></a>
    <div class="der">
      <nav class="fam" aria-label="Apps de AVHUB"><a href="https://screens.mediaservi.com/" target="_blank" rel="noopener" aria-label="SCREENS"><img src="assets/logos/screens-logo.svg" alt="SCREENS"></a><a href="https://systems.mediaservi.com/" target="_blank" rel="noopener" aria-label="SYSTEMS"><img src="assets/logos/systems-logo.svg" alt="SYSTEMS"></a><a href="https://vjshow.mediaservi.com/" target="_blank" rel="noopener" aria-label="VJSHOW"><img src="assets/logos/vjshow-logo.svg" alt="VJSHOW"></a><a href="https://msgame.mediaservi.com/" target="_blank" rel="noopener" aria-label="MSGAME"><img src="assets/logos/msgame-logo.svg" alt="MSGAME"></a></nav>
      <button type="button" class="tecla" data-a="idioma" id="btn-idioma">ES</button>
    </div>
  </header>
  <main class="consola">
    <div class="izq">
      <section class="zona" id="zona-disp" aria-label="Displays"></section>
      <section class="zona" id="zona-listas" aria-label="Listas"></section>
    </div>
    <section class="zona lienzo-zona" aria-label="Lienzo">
      <div class="barra" id="barra"></div>
      <div class="lienzo" id="lienzo"><div class="mesa"><div class="display" id="display"><iframe id="previa" title="Vista previa" allow="fullscreen"></iframe><div class="guias" id="guias"></div><div class="ed" id="ed"><div class="ed-esc" id="ed-esc"></div><div class="ed-capa" id="ed-capa"></div></div></div></div><div class="suelta" id="suelta"></div></div>
      <div class="tira" id="tira" hidden></div>
      <div class="estado" id="estado"><i></i><span></span></div>
    </section>
    <section class="zona lado" id="zona-tabs" aria-label="Ajustes"><div class="tabs" id="tabs" role="tablist"></div><div class="cuerpo" id="cuerpo" role="tabpanel"></div></section>
  </main>
  <footer class="pie" id="pie"></footer>
  <div class="modal" id="modal" hidden></div>
  <input type="file" id="archivo" accept="application/json,.json" hidden>
  <input type="file" id="sube-img" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden>
  <noscript><p style="padding:2rem;color:#fff">ADPOSTER necesita JavaScript activado.</p></noscript>
  <script src="credito.js?v=1.6"></script>
  <script src="fallo.js?v=1.6"></script>
  <script src="instalar.js?v=1.6"></script>
  <script src="directo.js?v=1.6"></script>
  <script src="qr.js?v=1.6"></script>
  <script src="escena.js?v=1.6"></script>
  <script src="plantillas.js?v=1.6"></script>
  <script src="gestor.js?v=1.6"></script>
  <script src="editor.js?v=1.6"></script>
  <script src="gestion.js?v=1.6"></script>

</html>
