<!DOCTYPE html>
<!--
  ADPOSTER · CARTELERÍA DIGITAL — gestor de playlists para displays FHD en vertical. Apartado de AVHUB (mediaservi.com).
  Versión v0.4 (beta). Tres zonas, como el resto de la familia: «contenido» a la izquierda, el display con la vista previa en vivo en el centro
  y «reproducción» a la derecha. Los reproductores son las URL que se dan al kiosco: …/cine, …/klub y …/p/?l=nombre.
  Módulos: gestor.js (este gestor), player.js (reproductor), playlists.json (ajustes), assets/manifest.json (índice de imágenes, lo genera tools/preparar.py).
  Licencia GPL-3.0 · mediaservi.com
-->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ADPOSTER · Cartelería digital</title>
  <meta name="description" content="ADPOSTER: cartelería digital profesional y fácil para pantallas en vertical. Playlists de pósteres con anuncios intercalados, fundidos, horarios y arranque automático.">
  <meta name="theme-color" content="#232325">
  <link rel="icon" href="assets/logos/adposter-icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gestor.css?v=0.4">
</head>
<body>
  <header class="cab">
    <a class="marca" href="./" aria-label="ADPOSTER"><img src="assets/logos/adposter-logo-lema.svg" alt="ADPOSTER" width="454" height="120"></a>
    <a class="centro" href="https://avhub.mediaservi.com/" target="_blank" rel="noopener" aria-label="AVHUB"><img src="assets/logos/avhub-logo.svg" alt="AVHUB"></a>
    <div class="der">
      <nav class="fam" aria-label="Apps de AVHUB"><a href="https://screens.mediaservi.com/" target="_blank" rel="noopener" aria-label="SCREENS"><img src="assets/logos/screens-logo.svg" alt="SCREENS"></a><a href="https://systems.mediaservi.com/" target="_blank" rel="noopener" aria-label="SYSTEMS"><img src="assets/logos/systems-logo.svg" alt="SYSTEMS"></a><a href="https://vjshow.mediaservi.com/" target="_blank" rel="noopener" aria-label="VJSHOW"><img src="assets/logos/vjshow-logo.svg" alt="VJSHOW"></a><a href="https://msgame.mediaservi.com/" target="_blank" rel="noopener" aria-label="MSGAME"><img src="assets/logos/msgame-logo.svg" alt="MSGAME"></a></nav>
      <button type="button" class="tecla" data-a="idioma" id="btn-idioma">ES</button>
    </div>
  </header>
  <main class="consola">
    <section class="zona" id="zona-a" aria-label="Contenido"></section>
    <section class="centro-zona"><div class="display"><iframe id="previa" title="Vista previa" allow="fullscreen"></iframe></div><div class="estado" id="estado"><i></i><span></span></div></section>
    <section class="zona" id="zona-b" aria-label="Reproducción"></section>
  </main>
  <footer class="pie" id="pie"></footer>
  <input type="file" id="archivo" accept="application/json,.json" hidden>
  <noscript><p style="padding:2rem;color:#fff">ADPOSTER necesita JavaScript activado.</p></noscript>
  <script src="credito.js?v=0.4"></script>
  <script src="gestor.js?v=0.4"></script>
</body>
</html>
