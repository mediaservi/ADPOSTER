<!DOCTYPE html>
<!--
  ADPOSTER LINK (v1.52) — la app de Android TV de ADPOSTER: abre el reproductor a pantalla completa, sin menús,
  y arranca sola cada vez que vuelve la luz. Esta página explica qué hace falta, cómo se instala y cómo se prueba antes.

<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ADPOSTER LINK · la app para la tele</title>
  <meta name="description" content="ADPOSTER LINK: la app de Android TV que convierte la tele en un cartel digital que arranca solo al volver la luz.">
  <meta name="theme-color" content="#232325">
  <link rel="icon" href="../assets/logos/adposter-icono-placa.svg?v=placa" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Inter'; font-weight: 400; font-display: swap; src: url(../assets/fonts/inter-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Inter'; font-weight: 700 900; font-display: swap; src: url(../assets/fonts/inter-latin-800-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Share Tech Mono'; font-weight: 400; font-display: swap; src: url(../assets/fonts/share-tech-mono-latin-400-normal.woff2) format('woff2'); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #121213; color: #e9ebee; font: 400 16px/1.45 Inter, system-ui, Arial, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: linear-gradient(180deg, #303034, #1d1d20); border-bottom: 1px solid #0a0a0b; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
    header a img { height: 34px; display: block; }
    .idi { display: flex; gap: 6px; }
    .idi button { font: 700 13px Inter, Arial, sans-serif; color: #e9ebee; background: linear-gradient(180deg, #4a4a50, #2c2c30); border: 1px solid #0a0a0b; border-radius: 7px; padding: 7px 10px; cursor: pointer; }
    .idi button.on { background: #ffb000; color: #000; border-color: #ffb000; }
    main { max-width: 860px; margin: 0 auto; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 16px; }
    .cab { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .cab img { width: 240px; max-width: 70vw; border-radius: 12px; box-shadow: 0 8px 24px #000a; }
    .cab p { flex: 1 1 260px; margin: 0; font-size: 18px; }
    h1 { margin: 0; font: 400 14px 'Share Tech Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: #ffb000; }
    h2 { margin: 6px 0 0; font: 400 13px 'Share Tech Mono', monospace; letter-spacing: .18em; text-transform: uppercase; color: #9aa0aa; }
    .caja { padding: 14px 16px; border-radius: 12px; background: linear-gradient(180deg, #26262a, #1b1b1e); border: 1px solid #0a0a0b; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); }
    .caja ol, .caja ul { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 8px; }
    .caja b { color: #fff; }
    .lcd { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #0b0a06; color: #ffb000; font: 400 15px 'Share Tech Mono', monospace; box-shadow: inset 0 2px 6px #000; word-break: break-all; }
    .baja { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 20px; border-radius: 10px; font: 800 17px Inter, Arial, sans-serif; text-decoration: none; color: #000; background: linear-gradient(180deg, #ffc94d, #ffb000); border: 1px solid #8a5d00; box-shadow: 0 4px 14px rgba(255, 176, 0, .25); }
    .btn.sec { color: #e9ebee; background: linear-gradient(180deg, #4a4a50, #2c2c30); border-color: #0a0a0b; box-shadow: none; }
    .nota { color: #9aa0aa; font-size: 14px; }
    footer { padding: 16px; text-align: center; color: #7d828c; font-size: 13px; }
    footer a { color: #ffb000; text-decoration: none; }
    @media (max-width: 420px) { .btn { width: 100%; justify-content: center; } }
  </style>
</head>
<body>
  <header><a href="../"><img src="../assets/logos/adposter-logo.svg" alt="ADPOSTER"></a><div class="idi"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button><button type="button" data-l="ca">CA</button></div></header>
  <main id="m"></main>
  <footer id="pie"></footer>
  <script>
  (function () {
    'use strict';
    var APK = 'https://github.com/mediaservi/ADPOSTER/releases/download/link/adposter-link.apk', CORTA = 'adposter.mediaservi.com/link/apk';
    var TX = {
      es: {
        t: 'ADPOSTER LINK · la app para la tele',
        intro: 'La app de Android TV de ADPOSTER. Convierte la tele en un cartel que <b>arranca solo</b>: das la luz, se enciende la tele, arranca el aparato y se pone a reproducir tu lista, sin menús ni mando. Reproduce con <b>todas las reglas del gestor</b>: tiempos, anuncios cada X carteles, horarios, calendario, avisos y emergencia.',
        baja: 'Descargar la app (APK)', gestor: 'Abrir el gestor',
        corta: 'Dirección corta para teclear con el mando en la app Downloader:',
        h1: 'Pruébalo antes', p1: 'En el gestor, <b>+ Añadir pantalla</b> › <b>▶ Probar cómo se verá</b>: tu lista se reproduce en una tele dibujada, con sus reglas, y con los botones de giro la ves montada en horizontal, en vertical o boca abajo.',
        h2: 'Qué necesitas', r: ['Un <b>aparato con Android TV o Google TV</b> en el HDMI de la tele (un stick como el Xiaomi Mi TV Stick, un Chromecast con Google TV o un TV box), con Android 5 o posterior.', 'Que la <b>tele se encienda sola</b> al volver la luz (en sus ajustes: encendido automático o modo hotel) y que el aparato tome corriente con ella: mejor con <b>su propio cargador</b> a la red que del USB de la tele.', 'Conexión a internet (wifi o cable). Sin conexión sigue con lo último que tenía guardado.'],
        h3: 'Instalar (una sola vez)', i: ['En el aparato, instala <b>Downloader</b> desde la tienda de apps.', 'Ajustes › Preferencias del dispositivo › Seguridad y restricciones › <b>Fuentes desconocidas</b>: activa Downloader.', 'Abre Downloader, escribe <span class="lcd">' + CORTA + '</span> y pulsa <b>Ir</b>. Cuando acabe de bajar, <b>Instalar</b>.', 'Abre <b>ADPOSTER LINK</b>. La primera vez pide el permiso <b>«Mostrar sobre otras apps»</b>: dáselo, es lo que la deja arrancar sola al encender.', 'Sale un <b>código de 6 caracteres</b>. En el gestor, <b>+ Añadir pantalla</b>, elige la lista y el giro, escribe el código y listo.'],
        h4: 'Giro de la pantalla', p4: 'Si la tele está montada en vertical o boca abajo: en el gestor, <b>DIRECTO</b> › elige la pantalla › <b>Giro de la pantalla</b> (0°, 90°, 180° o 270°). O en la propia tele: <b>OK</b> en el mando › <b>Giro de la pantalla</b>. La pantalla vuelve a arrancar ya girada y lo recuerda.',
        h5: 'Menú de la app', p5: 'Tecla <b>MENÚ</b> del mando, <b>mantener ATRÁS</b> o pulsar ATRÁS tres veces: recargar, volver a dar de alta (código nuevo), arrancar sola al encender, permiso, <b>modo kiosco total</b> (ADPOSTER LINK como pantalla de inicio del aparato) y ajustes. ATRÁS solo nunca cierra la app.',
        h6: 'La prueba de la luz', p6: 'Con todo funcionando, desenchufa la regleta y vuelve a enchufarla. En un minuto o dos la tele debe estar reproduciendo sola. Si se queda en la pantalla de inicio del aparato, revisa el permiso del paso 4 o activa el modo kiosco total.',
        nota: 'App gratuita y de código abierto, sin cuentas ni publicidad. No está en la tienda de Google: se instala con Downloader. Solo abre adposter.mediaservi.com.'
      },
      en: {
        t: 'ADPOSTER LINK · the TV app',
        intro: 'ADPOSTER’s Android TV app. It turns the TV into a sign that <b>starts by itself</b>: power comes back, the TV turns on, the device boots and your list plays, with no menus or remote. It plays with <b>all the manager’s rules</b>: timing, an ad every X posters, schedules, calendar, notices and emergency.',
        baja: 'Download the app (APK)', gestor: 'Open the manager',
        corta: 'Short address to type with the remote in the Downloader app:',
        h1: 'Try it first', p1: 'In the manager, <b>+ Add screen</b> › <b>▶ Try how it will look</b>: your list plays on a drawn TV with its rules, and the rotation buttons show it mounted landscape, portrait or upside down.',
        h2: 'What you need', r: ['An <b>Android TV or Google TV device</b> on the TV’s HDMI (a stick like the Xiaomi Mi TV Stick, a Chromecast with Google TV or a TV box), Android 5 or later.', 'The <b>TV must turn on by itself</b> when power returns (in its settings: auto power-on or hotel mode) and the device must get power with it: better with <b>its own charger</b> on the mains than from the TV’s USB.', 'Internet (Wi-Fi or cable). Without it, it keeps playing what it had saved.'],
        h3: 'Install (just once)', i: ['On the device, install <b>Downloader</b> from the app store.', 'Settings › Device preferences › Security & restrictions › <b>Unknown sources</b>: turn on Downloader.', 'Open Downloader, type <span class="lcd">' + CORTA + '</span> and press <b>Go</b>. When it finishes, <b>Install</b>.', 'Open <b>ADPOSTER LINK</b>. The first time it asks for <b>“Display over other apps”</b>: allow it, that is what lets it start by itself at power-on.', 'A <b>6-character code</b> appears. In the manager, <b>+ Add screen</b>, choose the list and rotation, type the code and you are done.'],
        h4: 'Screen rotation', p4: 'If the TV is mounted portrait or upside down: in the manager, <b>LIVE</b> › pick the screen › <b>Screen rotation</b> (0°, 90°, 180° or 270°). Or on the TV itself: <b>OK</b> on the remote › <b>Screen rotation</b>. The screen restarts already rotated and remembers it.',
        h5: 'App menu', p5: '<b>MENU</b> key on the remote, <b>hold BACK</b> or press BACK three times: reload, add the screen again (new code), start by itself at power-on, permission, <b>full kiosk mode</b> (ADPOSTER LINK as the device’s home screen) and settings. A single BACK never closes the app.',
        h6: 'The power test', p6: 'With everything working, unplug the power strip and plug it back in. In a minute or two the TV should be playing by itself. If it stays on the device’s home screen, check the permission in step 4 or turn on full kiosk mode.',
        nota: 'Free, open-source app, with no accounts or ads. It is not on Google’s store: install it with Downloader. It only opens adposter.mediaservi.com.'
      },
      ca: {
        t: 'ADPOSTER LINK · l’app per a la tele',
        intro: 'L’app d’Android TV d’ADPOSTER. Converteix la tele en un cartell que <b>arrenca sol</b>: tornes la llum, s’encén la tele, arrenca l’aparell i es posa a reproduir la teva llista, sense menús ni comandament. Reprodueix amb <b>totes les regles del gestor</b>: temps, anuncis cada X cartells, horaris, calendari, avisos i emergència.',
        baja: 'Descarrega l’app (APK)', gestor: 'Obre el gestor',
        corta: 'Adreça curta per teclejar amb el comandament a l’app Downloader:',
        h1: 'Prova-ho abans', p1: 'Al gestor, <b>+ Afegeix una pantalla</b> › <b>▶ Prova com es veurà</b>: la teva llista es reprodueix en una tele dibuixada, amb les seves regles, i amb els botons de gir la veus muntada en horitzontal, en vertical o de cap per avall.',
        h2: 'Què necessites', r: ['Un <b>aparell amb Android TV o Google TV</b> a l’HDMI de la tele (un stick com el Xiaomi Mi TV Stick, un Chromecast amb Google TV o un TV box), amb Android 5 o posterior.', 'Que la <b>tele s’encengui sola</b> quan torna la llum (als seus ajustos: encesa automàtica o mode hotel) i que l’aparell agafi corrent amb ella: millor amb <b>el seu propi carregador</b> a la xarxa que de l’USB de la tele.', 'Connexió a internet (wifi o cable). Sense connexió continua amb l’últim que tenia desat.'],
        h3: 'Instal·lar (un sol cop)', i: ['A l’aparell, instal·la <b>Downloader</b> des de la botiga d’apps.', 'Configuració › Preferències del dispositiu › Seguretat i restriccions › <b>Fonts desconegudes</b>: activa Downloader.', 'Obre Downloader, escriu <span class="lcd">' + CORTA + '</span> i prem <b>Vés</b>. Quan acabi de baixar, <b>Instal·la</b>.', 'Obre <b>ADPOSTER LINK</b>. El primer cop demana el permís <b>«Mostra sobre altres aplicacions»</b>: dona-l’hi, és el que la deixa arrencar sola en engegar.', 'Surt un <b>codi de 6 caràcters</b>. Al gestor, <b>+ Afegeix una pantalla</b>, tria la llista i el gir, escriu el codi i ja està.'],
        h4: 'Gir de la pantalla', p4: 'Si la tele està muntada en vertical o de cap per avall: al gestor, <b>DIRECTE</b> › tria la pantalla › <b>Gir de la pantalla</b> (0°, 90°, 180° o 270°). O a la mateixa tele: <b>OK</b> al comandament › <b>Gir de la pantalla</b>. La pantalla torna a arrencar ja girada i ho recorda.',
        h5: 'Menú de l’app', p5: 'Tecla <b>MENÚ</b> del comandament, <b>mantenir ENRERE</b> o prémer ENRERE tres cops: tornar a carregar, tornar a donar d’alta (codi nou), arrencar sola en engegar, permís, <b>mode quiosc total</b> (ADPOSTER LINK com a pantalla d’inici de l’aparell) i ajustos. Un ENRERE sol mai tanca l’app.',
        h6: 'La prova de la llum', p6: 'Amb tot funcionant, desendolla la regleta i torna-la a endollar. En un minut o dos la tele ha d’estar reproduint sola. Si es queda a la pantalla d’inici de l’aparell, revisa el permís del pas 4 o activa el mode quiosc total.',
        nota: 'App gratuïta i de codi obert, sense comptes ni publicitat. No és a la botiga de Google: s’instal·la amb Downloader. Només obre adposter.mediaservi.com.'
      }
    };
    var L = (location.search.match(/[?&]lang=(es|en|ca)\b/) || [])[1]; try { L = L || JSON.parse(localStorage.getItem('adposter:lang')); } catch (e) {}
    L = /^(es|en|ca)$/.test(L || '') ? L : (/^ca\b/i.test(navigator.language || '') ? 'ca' : /^es\b/i.test(navigator.language || '') ? 'es' : /^en\b/i.test(navigator.language || '') ? 'en' : 'es');
    function pinta() {
      var t = TX[L]; document.documentElement.lang = L; document.title = t.t;
      document.getElementById('m').innerHTML =
        '<div class="cab"><img src="../assets/logos/adposter-link-banner.png" alt="ADPOSTER LINK" width="320" height="180"><p>' + t.intro + '</p></div>' +
        '<div class="baja"><a class="btn" href="' + APK + '">⬇ ' + t.baja + '</a><a class="btn sec" href="../">' + t.gestor + '</a></div>' +
        '<div class="nota">' + t.corta + ' <span class="lcd">' + CORTA + '</span></div>' +
        '<h2>' + t.h1 + '</h2><div class="caja">' + t.p1 + '</div>' +
        '<h2>' + t.h2 + '</h2><div class="caja"><ul><li>' + t.r.join('</li><li>') + '</li></ul></div>' +
        '<h2>' + t.h3 + '</h2><div class="caja"><ol><li>' + t.i.join('</li><li>') + '</li></ol></div>' +
        '<h2>' + t.h4 + '</h2><div class="caja">' + t.p4 + '</div>' +
        '<h2>' + t.h5 + '</h2><div class="caja">' + t.p5 + '</div>' +
        '<h2>' + t.h6 + '</h2><div class="caja">' + t.p6 + '</div>' +
        '<div class="nota">' + t.nota + '</div>';
      document.getElementById('pie').innerHTML = 'ADPOSTER v1.52 ' + new Date().getFullYear() + ' · <a href="https://mediaservi.com">mediaservi.com</a> · GPL-3.0';
      [].forEach.call(document.querySelectorAll('.idi button'), function (b) { b.classList.toggle('on', b.dataset.l === L); });
    }
    [].forEach.call(document.querySelectorAll('.idi button'), function (b) { b.addEventListener('click', function () { L = b.dataset.l; try { localStorage.setItem('adposter:lang', JSON.stringify(L)); } catch (e) {} pinta(); }); });
    pinta();
  })();
  </script>
</body>
</html>
